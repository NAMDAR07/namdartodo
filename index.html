<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>NAMDAR To Do List</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Vazirmatn:wght@400;700&display=swap');
        
        body { font-family: 'Vazirmatn', sans-serif; background: #0a0a0a; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1a1a1a; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; }
        h1 { color: #3b82f6; text-align: center; font-family: 'Poppins', sans-serif; margin-bottom: 25px; }
        
        .task-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px; border-bottom: 1px solid #333; 
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .stats { margin-bottom: 25px; padding: 15px; background: #252525; border-radius: 12px; }
        #progressFill { height: 100%; background: linear-gradient(90deg, #3b82f6, #60a5fa); width: 0%; transition: width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        input { width: 100%; padding: 12px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: #fff; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: #3b82f6; outline: none; }
        button { width: 100%; padding: 12px; margin-top: 5px; background: #3b82f6; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: transform 0.2s, background 0.3s; }
        button:hover { background: #2563eb; transform: scale(1.02); }
        
        .done { text-decoration: line-through; opacity: 0.5; transform: scale(0.98); transition: 0.3s; }
        .btn-act { cursor: pointer; font-size: 13px; padding: 4px 8px; border-radius: 4px; transition: 0.2s; }
        .edit { color: #facc15; border: 1px solid #facc15; }
        .del { color: #ef4444; border: 1px solid #ef4444; }
        .btn-act:hover { filter: brightness(1.5); }
    </style>
</head>
<body>

<div class="container">
    <h1>NAMDAR To Do List</h1>
    
    <div class="stats">
        <div id="statsText">۰ از ۰ کار انجام شده</div>
        <div id="statusMessage" style="font-size: 13px; color: #3b82f6; margin-top:5px; font-weight: 600;"></div>
        <div id="progressBar" style="height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 5px;">
            <div id="progressFill"></div>
        </div>
    </div>

    <input type="text" id="searchInput" placeholder="🔍 جستجو در کارها..." oninput="renderTasks()">
    <input type="text" id="taskInput" placeholder="کار جدید چی داری؟">
    <button onclick="addTask()">افزودن</button>
    <div id="taskList" style="margin-top: 15px;"></div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function renderTasks() {
        let filter = document.getElementById("searchInput").value.toLowerCase();
        let list = document.getElementById("taskList");
        list.innerHTML = "";
        
        let filtered = tasks.filter(t => t.text.toLowerCase().includes(filter));
        let doneCount = tasks.filter(t => t.done).length;
        
        let statusMsg = document.getElementById("statusMessage");
        let percent = tasks.length ? (doneCount / tasks.length) * 100 : 0;
        document.getElementById("progressFill").style.width = percent + "%";
        document.getElementById("statsText").innerText = `${doneCount} از ${tasks.length} کار انجام شده`;
        
        if (percent === 100 && tasks.length > 0) statusMsg.innerText = "سلطان، عالی بودی! همه کارها انجام شد.";
        else if (percent > 50) statusMsg.innerText = "پر قدرت ادامه بده، بیشتر از نصف راه رو رفتی!";
        else if (tasks.length > 0) statusMsg.innerText = "هنوز کارهای زیادی باقی مونده، بجنب!";
        else statusMsg.innerText = "لیست خالیه، یه کار جدید اضافه کن.";

        filtered.forEach((t, i) => {
            let index = tasks.indexOf(t);
            let div = document.createElement("div");
            div.className = `task-item ${t.done ? 'done' : ''}`;
            div.innerHTML = `
                <span>${t.text}</span>
                <div style="display: flex; gap: 10px;">
                    <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggleTask(${index})">
                    <span class="btn-act edit" onclick="editTask(${index})">ویرایش</span>
                    <span class="btn-act del" onclick="deleteTask(${index})">حذف</span>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function addTask() {
        let text = document.getElementById("taskInput").value;
        if (!text) return alert("سلطان، عنوان کار رو وارد کن!");
        tasks.push({text, done: false});
        save();
        document.getElementById("taskInput").value = "";
    }

    function toggleTask(i) { tasks[i].done = !tasks[i].done; save(); }
    function deleteTask(i) { tasks.splice(i, 1); save(); }
    function editTask(i) {
        let newText = prompt("عنوان جدید کار رو وارد کن:", tasks[i].text);
        if (newText) tasks[i].text = newText;
        save();
    }
    function save() { localStorage.setItem("tasks", JSON.stringify(tasks)); renderTasks(); }

    renderTasks();
</script>
</body>
</html>
