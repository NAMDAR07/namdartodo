<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOMDAR To Do LIst</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --daily-color: #ff4757;
            --even-color: #00d2ff;
            --odd-color: #2ed573;
            --routine-color: #f1c40f;
            --friday-color: #a55eea;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 95%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            margin-top: 20px;
        }

        h1 { text-align: center; font-size: 1.6rem; margin-bottom: 10px; color: #fff; direction: ltr; text-shadow: 0 0 10px rgba(0,210,255,0.5); }
        
        .day-badge {
            display: block; text-align: center; font-size: 0.9rem; margin-bottom: 25px;
            padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.1);
            font-weight: bold;
        }

        .task-card {
            background: rgba(255, 255, 255, 0.08);
            margin-bottom: 12px;
            padding: 16px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
            border-right: 5px solid transparent;
        }

        .daily { border-right-color: var(--daily-color); }
        .even { border-right-color: var(--even-color); }
        .odd { border-right-color: var(--odd-color); }
        .routine { border-right-color: var(--routine-color); }
        .friday-special { border-right-color: var(--friday-color); }

        .task-text { font-size: 1.05rem; font-weight: 500; }

        .done-btn {
            background: rgba(255,255,255,0.1); border: none; color: white;
            width: 35px; height: 35px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .completed {
            opacity: 0.3 !important;
            text-decoration: line-through !important;
            filter: grayscale(1);
        }

        #motivation-box {
            position: fixed; bottom: 30px; padding: 15px 25px;
            background: #f1c40f; color: #000; border-radius: 50px;
            font-weight: bold; display: none; z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="container animate__animated animate__fadeIn">
        <h1>NOMDAR To Do LIst</h1>
        <div id="day-badge" class="day-badge">...</div>
        <div id="todo-list"></div>
        <button onclick="resetTasks()" style="margin-top: 25px; background: none; border: 1px solid rgba(255,255,255,0.2); color: #aaa; cursor: pointer; border-radius: 10px; padding: 8px 15px; width: 100%;">ریست کردن تیک‌ها برای شروع روز جدید</button>
    </div>

    <div id="motivation-box" class="animate__animated"></div>

    <script>
        const allTasks = [
            { id: 1, text: "⏰ بیدار شدن ساعت ۶ صبح", type: "routine" },
            { id: 2, text: "📚 یادگیری زبان", type: "daily" },
            { id: 3, text: "💻 برنامه‌نویسی", type: "daily" },
            { id: 4, text: "🤝 تقویت ارتباطات", type: "daily" },
            { id: 5, text: "🎬 سناریو نویسی", type: "even" }, // شنبه، دوشنبه، چهارشنبه
            { id: 6, text: "✂️ تدوین ویدیو", type: "even" },   // شنبه، دوشنبه، چهارشنبه
            { id: 7, text: "🤖 هوش مصنوعی", type: "odd" },    // یکشنبه، سه‌شنبه، پنجشنبه
            { id: 8, text: "🎨 طراحی گرافیک", type: "odd" },   // یکشنبه، سه‌شنبه، پنجشنبه
            { id: 9, text: "📖 خواندن کتاب", type: "routine" },
            { id: 10, text: "🥗 رعایت رژیم غذایی", type: "routine" },
            { id: 11, text: "🎯 تمرکز لیزری", type: "routine" }
        ];

        const dayNames = ["یکشنبه", "دوشنبه", "سه‌شنبه", "چهارشنبه", "پنجشنبه", "جمعه", "شنبه"];

        function initApp() {
            const listElement = document.getElementById('todo-list');
            const dayBadge = document.getElementById('day-badge');
            
            // گرفتن روز هفته (0 برای یکشنبه، 6 برای شنبه)
            const dayIndex = new Date().getDay(); 
            const dayName = dayNames[dayIndex];

            // منطق زوج و فرد ایرانی
            // زوج: شنبه(6)، دوشنبه(1)، چهارشنبه(3)
            // فرد: یکشنبه(0)، سه‌شنبه(2)، پنجشنبه(4)
            // جمعه: (5)
            const isEvenDay = [6, 1, 3].includes(dayIndex);
            const isOddDay = [0, 2, 4].includes(dayIndex);
            const isFriday = dayIndex === 5;

            let statusText = `امروز ${dayName} است - `;
            if (isEvenDay) {
                statusText += "روز زوجه 🔵";
                dayBadge.style.color = "var(--even-color)";
            } else if (isOddDay) {
                statusText += "روز فرده 🟢";
                dayBadge.style.color = "var(--odd-color)";
            } else {
                statusText += "روز جمعه و استراحته 🟣";
                dayBadge.style.color = "var(--friday-color)";
            }
            dayBadge.innerText = statusText;

            const completedTasks = JSON.parse(localStorage.getItem('nomdar_done') || "[]");
            listElement.innerHTML = "";

            allTasks.forEach((task) => {
                let showTask = false;
                if (task.type === "routine" || task.type === "daily") showTask = true;
                if (task.type === "even" && isEvenDay) showTask = true;
                if (task.type === "odd" && isOddDay) showTask = true;

                if (showTask) {
                    const isDone = completedTasks.includes(task.id);
                    const card = document.createElement('div');
                    card.className = `task-card ${task.type} ${isDone ? 'completed' : ''}`;
                    card.innerHTML = `
                        <span class="task-text">${task.text}</span>
                        <button class="done-btn" onclick="completeTask(${task.id}, this)">✓</button>
                    `;
                    listElement.appendChild(card);
                }
            });
        }

        function completeTask(id, btn) {
            const card = btn.parentElement;
            if (card.classList.contains('completed')) return;
            card.classList.add('completed');
            let completedTasks = JSON.parse(localStorage.getItem('nomdar_done') || "[]");
            if (!completedTasks.includes(id)) {
                completedTasks.push(id);
                localStorage.setItem('nomdar_done', JSON.stringify(completedTasks));
            }
            const msgBox = document.getElementById('motivation-box');
            msgBox.innerText = "دمت گرم سلطان!";
            msgBox.style.display = 'block';
            msgBox.className = 'animate__animated animate__bounceInUp';
            setTimeout(() => { msgBox.style.display = 'none'; }, 2000);
        }

        function resetTasks() {
            if(confirm("سلطان، تیک‌ها رو برای امروز پاک کنم؟")) {
                localStorage.removeItem('nomdar_done');
                initApp();
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
