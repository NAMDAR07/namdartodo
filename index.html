<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد موفقیت سلطان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --daily-color: #ff4757;
            --even-color: #00d2ff;
            --odd-color: #2ed573;
            --routine-color: #f1c40f; /* رنگ طلایی برای کارهای اختیاری/ثابت */
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 95%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 { text-align: center; font-size: 1.6rem; margin-bottom: 10px; color: #fff; }
        
        .day-badge {
            display: block; text-align: center; font-size: 0.9rem; margin-bottom: 25px;
            padding: 8px; border-radius: 12px; background: rgba(255,255,255,0.1);
        }

        .task-card {
            background: rgba(255, 255, 255, 0.08);
            margin-bottom: 12px;
            padding: 16px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
            border-right: 5px solid transparent;
        }

        .task-card:hover { transform: scale(1.02); background: rgba(255,255,255,0.12); }

        /* استایل رنگ‌ها */
        .daily { border-right-color: var(--daily-color); }
        .even { border-right-color: var(--even-color); }
        .odd { border-right-color: var(--odd-color); }
        .routine { border-right-color: var(--routine-color); }

        .task-text { font-size: 1.05rem; font-weight: 500; }

        .done-btn {
            background: rgba(255,255,255,0.1); border: none; color: white;
            width: 35px; height: 35px; border-radius: 50%; cursor: pointer;
            transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }

        .done-btn:hover { background: #2ed573; transform: rotate(15deg); }

        .completed {
            opacity: 0.3;
            text-decoration: line-through;
            pointer-events: none;
            filter: grayscale(1);
        }

        #motivation-box {
            position: fixed; bottom: 30px; padding: 15px 25px;
            background: #f1c40f; color: #000; border-radius: 50px;
            font-weight: bold; display: none; z-index: 1000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="container animate__animated animate__fadeIn">
        <h1>برنامه موفقیت سلطان</h1>
        <div id="day-badge" class="day-badge">...</div>
        <div id="todo-list"></div>
    </div>

    <div id="motivation-box" class="animate__animated"></div>

    <script>
        // لیست تمام کارها
        const allTasks = [
            { text: "⏰ بیدار شدن ساعت ۶ صبح", type: "routine" }, // اول لیست
            { text: "📚 یادگیری زبان", type: "daily" },
            { text: "💻 برنامه‌نویسی", type: "daily" },
            { text: "🤝 تقویت ارتباطات", type: "daily" },
            { text: "🎬 سناریو نویسی", type: "even" },
            { text: "✂️ تدوین ویدیو", type: "even" },
            { text: "🤖 هوش مصنوعی", type: "odd" },
            { text: "🎨 طراحی گرافیک", type: "odd" },
            { text: "📖 خواندن کتاب", type: "routine" }, // دوتا مونده به آخر
            { text: "🥗 رعایت رژیم غذایی", type: "routine" }, // یکی مونده به آخر
            { text: "🎯 تمرکز لیزری", type: "routine" } // آخرین گزینه
        ];

        const quotes = ["دمت گرم سلطان!", "داری میترکونی 🔥", "یک قدم تا هدف 🚀", "عالی بود قهرمان!", "ادامه بده، تو برنده ای 👑"];

        function initApp() {
            const listElement = document.getElementById('todo-list');
            const dayBadge = document.getElementById('day-badge');
            
            const today = new Date().getDate();
            const isEven = today % 2 === 0;

            dayBadge.innerText = isEven ? "🗓️ امروز روز زوجه" : "🗓️ امروز روز فرده";
            dayBadge.style.color = isEven ? "var(--even-color)" : "var(--odd-color)";

            listElement.innerHTML = "";

            allTasks.forEach((task, index) => {
                // نمایش کارهای روتین، کارهای روزانه، و کارهای مخصوص همان روز (زوج یا فرد)
                if (task.type === "routine" || task.type === "daily" || (task.type === "even" && isEven) || (task.type === "odd" && !isEven)) {
                    const card = document.createElement('div');
                    card.className = `task-card ${task.type} animate__animated animate__fadeInUp`;
                    card.style.animationDelay = `${index * 0.05}s`;
                    
                    card.innerHTML = `
                        <span class="task-text">${task.text}</span>
                        <button class="done-btn" onclick="completeTask(this)">✓</button>
                    `;
                    listElement.appendChild(card);
                }
            });
        }

        function completeTask(btn) {
            const card = btn.parentElement;
            card.classList.add('completed');
            
            const msgBox = document.getElementById('motivation-box');
            msgBox.innerText = quotes[Math.floor(Math.random() * quotes.length)];
            msgBox.style.display = 'block';
            msgBox.className = 'animate__animated animate__bounceInUp';

            setTimeout(() => {
                msgBox.className = 'animate__animated animate__fadeOutDown';
                setTimeout(() => { msgBox.style.display = 'none'; }, 500);
            }, 2500);
        }

        initApp();
    </script>
</body>
</html>
